name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*' # Trigger on version tags like v1.0.0, v0.7.7
  workflow_dispatch: # Allow manual trigger
    inputs:
      version:
        description: 'Version to release (e.g., 1.0.0)'
        required: true
        type: string

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    permissions:
      contents: write # Required for creating releases

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Get version from tag or input
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION=${{ inputs.version }}
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

      - name: Update package.json version
        if: github.event_name == 'workflow_dispatch'
        run: |
          npm version ${{ steps.version.outputs.version }} --no-git-tag-version --allow-same-version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build project
        run: pnpm tsup

      - name: Create dist archive
        run: |
          cd dist
          tar -czf ../dist.tar.gz .
          zip -r ../dist.zip .
          cd ..

      - name: Configure Git for release refs
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

      - name: Prepare GitHub npm install refs
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail

          mkdir -p /tmp/release-package /tmp/release-assets
          cp package.json README.md /tmp/release-package/
          for file in LICENSE documentation.md; do
            if [ -f "$file" ]; then
              cp "$file" /tmp/release-package/
            fi
          done
          cp -r dist /tmp/release-package/dist
          cp dist.tar.gz dist.zip /tmp/release-assets/

          git fetch origin '+refs/heads/release:refs/remotes/origin/release' || true
          if git show-ref --verify --quiet refs/remotes/origin/release; then
            git checkout -B release refs/remotes/origin/release
          else
            git checkout --orphan release
          fi

          git rm -rf . 2>/dev/null || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +

          cp -r /tmp/release-package/. .
          git add -A
          git diff --cached --quiet || git commit -m "Release $TAG"
          git tag -f "$TAG"
          git push origin release --force
          git push origin "refs/tags/$TAG" --force

          cp /tmp/release-assets/dist.tar.gz /tmp/release-assets/dist.zip .

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }}
          draft: false
          prerelease: false
          files: |
            dist.tar.gz
            dist.zip
            package.json
          body: |
            ## Release ${{ steps.version.outputs.tag }}

            ### Changes
            Built and packaged dist files for version ${{ steps.version.outputs.version }}.

            ### Assets
            - `dist.tar.gz` - Compiled distribution files (tar.gz)
            - `dist.zip` - Compiled distribution files (zip)
            - `package.json` - Package configuration

            ### Installation

            **Always up to date**
            ```bash
            npm install github:${{ github.repository }}#release
            ```

            **Pinned to this version tag**
            ```bash
            npm install github:${{ github.repository }}#${{ steps.version.outputs.tag }}
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
